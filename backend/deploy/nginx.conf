server {
    listen 80;
    server_name legal.example.com;
    return 308 https://legal.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name legal.example.com;
    ssl_certificate /etc/nginx/tls/legal.example.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/legal.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/legal-service-hub;
    index index.html;
    client_max_body_size 3m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ^~ /api/v1/payments/webhooks/ {
        client_max_body_size 64k;
        limit_req zone=legal_webhook burst=200 nodelay;
        proxy_pass http://legal_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 5s;
    }
    location = /api/v1/files {
        client_max_body_size 55m;
        proxy_pass http://legal_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
    location ^~ /api/v1/auth/ {
        limit_req zone=legal_login burst=10 nodelay;
        proxy_pass http://legal_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/v1/ {
        proxy_pass http://legal_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
    location ^~ /api/v1/consultations/ {
        proxy_pass http://legal_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 240s;
    }
    location /health/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://legal_api;
    }
    location = /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://legal_api;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
